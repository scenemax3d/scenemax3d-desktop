[package]
name = "scenemax_runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = []
effekseer_native = ["dep:ash", "dep:wgpu"]

[dependencies]
anyhow.workspace = true
ash = { version = "0.38", optional = true }
avian3d.workspace = true
bevy = { workspace = true, features = ["3d", "bevy_ui", "bevy_ui_render", "bevy_text", "default_font", "bevy_sprite", "bevy_audio", "bevy_gizmos_render", "mesh_picking", "sysinfo_plugin", "vorbis", "wav", "mp3", "jpeg", "png", "hdr", "ktx2", "zstd_rust"] }
bevy-tnua.workspace = true
bevy-tnua-avian3d.workspace = true
scenemax_assets = { path = "../../Common/assets" }
scenemax_ir = { path = "../../Language/ir" }
scenemax_multiplayer = { path = "../multiplayer" }
scenemax_parser = { path = "../../Language/parser" }
scenemax_runtime_script_core = { path = "../scripting" }
scenemax_runtime_ui_core = { path = "../runtime_ui" }
scenemax_runtime_vm_core = { path = "../vm" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing.workspace = true
wgpu = { version = "29.0.4", default-features = false, features = ["std", "vulkan", "dx12"], optional = true }
