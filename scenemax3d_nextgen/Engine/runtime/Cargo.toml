[package]
name = "scenemax_runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = []
effekseer_native = ["scenemax_effects/effekseer_native"]

[dependencies]
scenemax_ui_input = { path = "../../Common/ui_input" }
scenemax_physics = { path = "../physics" }
scenemax_animation = { path = "../animation" }
scenemax_ik = { path = "../../Engine/ik" }
scenemax_materials = { path = "../../Engine/materials" }
scenemax_effects = { path = "../effects" }
anyhow.workspace = true
avian3d.workspace = true
bevy = { workspace = true, features = ["3d", "bevy_ui", "bevy_ui_render", "bevy_text", "system_clipboard", "default_font", "bevy_sprite", "bevy_audio", "bevy_gizmos_render", "mesh_picking", "sysinfo_plugin", "vorbis", "wav", "mp3", "jpeg", "png", "hdr", "ktx2", "zstd_rust"] }
bevy-tnua.workspace = true
bevy-tnua-avian3d.workspace = true
scenemax_assets = { path = "../../Common/assets" }
scenemax_ir = { path = "../../Language/ir" }
scenemax_multiplayer = { path = "../multiplayer" }
scenemax_parser = { path = "../../Language/parser" }
scenemax_runtime_script_core = { path = "../scripting" }
scenemax_runtime_ui_core = { path = "../runtime_ui" }
scenemax_runtime_vm_core = { path = "../vm" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2.workspace = true
tracing.workspace = true
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgpu"] }

[dev-dependencies]
tempfile.workspace = true
