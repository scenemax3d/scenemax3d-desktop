[package]
name = "scenemax_effects"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
[features]
effekseer_native = ["dep:ash", "dep:wgpu"]
[dependencies]
bevy = { workspace = true, features = ["3d"] }
