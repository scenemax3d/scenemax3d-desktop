[workspace]
members = [
    "crates/assets",
    "crates/ir",
    "crates/multiplayer",
    "crates/parser",
    "crates/projector",
    "crates/runtime",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1"
bevy = { version = "0.19.0", default-features = false, features = ["3d", "jpeg"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
